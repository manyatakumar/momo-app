name: Build Momo app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Build Momo.exe
        run: python build_app.py

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $env:MOMO_HOME = "$env:RUNNER_TEMP\momo-selftest"
          $p = Start-Process -FilePath dist\Momo.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:MOMO_HOME\selftest.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Momo.exe self-test failed (exit $($p.ExitCode))"; exit 1 }

      - name: Upgrade test (old Momo running, new Momo opened -> new one takes over)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.3 -R ${{ github.repository }} -p Momo.exe -D old
          $env:MOMO_HOME = "$env:RUNNER_TEMP\momo-upgrade"
          Start-Process -FilePath old\Momo.exe
          Start-Sleep -Seconds 15
          Start-Process -FilePath dist\Momo.exe
          Start-Sleep -Seconds 20
          $running = Get-Process -Name Momo -ErrorAction SilentlyContinue | Select-Object Id, Path
          $running | Format-Table -AutoSize | Out-String | Write-Host
          $oldAlive = $running | Where-Object { $_.Path -like "*\old\*" }
          $newAlive = $running | Where-Object { $_.Path -like "*\dist\*" }
          Stop-Process -Name Momo -Force -ErrorAction SilentlyContinue
          if ($oldAlive) { Write-Error "the old Momo is still running"; exit 1 }
          if (-not $newAlive) { Write-Error "the new Momo is not running"; exit 1 }
          Write-Host "old Momo closed, new Momo running"

      - uses: actions/upload-artifact@v4
        with:
          name: Momo-Windows
          path: dist/Momo.exe

      - name: Publish download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Momo for Windows (build ${{ github.run_number }})
          make_latest: true
          files: dist/Momo.exe
          body: |
            **Download `Momo.exe` below and double-click it.** No Python or setup needed.
            If Windows shows "Windows protected your PC": click **More info → Run anyway** (first time only).
